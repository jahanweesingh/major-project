name: bb84-secure-chat

services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/chat.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-2000}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-100}
    volumes:
      - chat-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    command: ["pytest", "-q", "-o", "faulthandler_timeout=15"]

  frontend-test:
    build:
      context: ./frontend
      target: test
    profiles: ["test"]
    command:
      - sh
      - -c
      - npm run lint && npm run typecheck && npm run test && npm run build

  smoke:
    image: node:22-alpine
    profiles: ["test"]
    working_dir: /smoke
    volumes:
      - ./scripts:/smoke:ro
    environment:
      CHAT_BASE_URL: http://frontend
    depends_on:
      frontend:
        condition: service_healthy
    command: ["node", "docker_chat_smoke.mjs"]

volumes:
  chat-data:
